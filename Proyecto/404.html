<!DOCTYPE html>
<!--
  404 de GitHub Pages.

  GitHub Pages sirve este fichero para cualquier ruta inexistente DENTRO del
  proyecto. Como toda la navegación es relativa, esto no debería activarse
  nunca; queda como red de seguridad para URLs antiguas o erratas.

  Todos los enlaces son relativos a propósito: así este fichero funciona igual
  en la raíz de un dominio que en la subruta de un repositorio (/mi-repo).
  No usa styles.css a propósito: si la URL que falló también ha roto el
  tema, la página de error tiene que seguir siendo legible.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Página no encontrada · LEGO Icons</title>
<style>
  /* Este bloque es intencionadamente autónomo: la página de error tiene que
     seguir siendo legible aunque styles.css no llegue a cargarse, que es
     justo lo que pasa cuando el visitor cae en un 404. Por eso repite los
     tokens en vez de importarlos. Los valores son los mismos que en el tema
     principal, y check.js lo vigila para que no se separen. */
  :root {
    --bg: #ffffff;
    --surface: #f7f7f8;
    --red: #d01012;
    --red-deep: #a00d0f;
    --red-ink: #a00d0f;
    --text-1: #1a1a1a;
    --text-2: #4a4a52;
    --line: #e4e4e7;
    --text-on-red: #ffffff;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    background: var(--bg);
    color: var(--text-1);
    font-family: var(--font);
    line-height: 1.6;
    text-align: center;
  }
  main { max-width: 34rem; }
  .code {
    font-size: clamp(4rem, 18vw, 7rem);
    line-height: 1;
    font-weight: 700;
    color: var(--red);
    margin: 0;
  }
  h1 { font-size: clamp(1.35rem, 4vw, 1.9rem); margin: 1rem 0 0.5rem; }
  p { color: var(--text-2); margin: 0 0 2rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
  .btn {
    display: inline-block;
    padding: 0.85rem 1.5rem;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    border: 1px solid transparent;
  }
  .btn--brand { background: var(--red); color: var(--text-on-red); }
  .btn--brand:hover { background: var(--red-deep); color: var(--text-on-red); }
  .btn--ghost { border-color: var(--line); color: var(--text-1); }
  .btn--ghost:hover { border-color: var(--red-ink); }
  .notice {
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--line);
    font-size: 0.8rem;
    color: var(--text-2);
  }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Esta página no existe</h1>
  <p>El enlace que has seguido está roto o ha cambiado de sitio. El catálogo
     sigue en su sitio de siempre.</p>
  <p class="actions">
    <a class="btn btn--brand" href="./index.html">Ir al catálogo</a>
    <a class="btn btn--ghost" href="./index.html#faq">Preguntas frecuentes</a>
  </p>
  <p class="notice">
    LEGO® es una marca registrada de LEGO Group, que no patrocina, autoriza ni
    avala este sitio.
  </p>
</main>
</body>
</html>
