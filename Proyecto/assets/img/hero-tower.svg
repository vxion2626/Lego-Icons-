<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="htTitle htDesc">
  <title id="htTitle">LEGO Icons — Torre Art Déco montada, iluminación dramática de estudio</title>
  <desc id="htDesc">Render de una torre Art Déco construida con piezas tipo LEGO, iluminada por un foco cenital, sobre una peana negra con placa dorada y reflejo en el suelo.</desc>

  <defs>
    <linearGradient id="htBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E0E12"/>
      <stop offset=".34" stop-color="#232329"/>
      <stop offset=".72" stop-color="#4A4A54"/>
      <stop offset=".92" stop-color="#6E6E7B"/>
      <stop offset="1" stop-color="#3A3A43"/>
    </linearGradient>
    <linearGradient id="htTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2B33"/>
      <stop offset=".5" stop-color="#585865"/>
      <stop offset="1" stop-color="#8C8C99"/>
    </linearGradient>
    <linearGradient id="htSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0A0D"/>
      <stop offset=".55" stop-color="#141418"/>
      <stop offset="1" stop-color="#1D1D23"/>
    </linearGradient>
    <linearGradient id="htCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#FFD502" stop-opacity=".09"/>
      <stop offset="1" stop-color="#FFD502" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="htPlinth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1A20"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <linearGradient id="htGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6B00"/>
      <stop offset=".35" stop-color="#FFD502"/>
      <stop offset=".75" stop-color="#FFF0A8"/>
      <stop offset="1" stop-color="#C9A200"/>
    </linearGradient>
    <radialGradient id="htHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD502" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#FFD502" stop-opacity=".10"/>
      <stop offset="1" stop-color="#FFD502" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="htFade" gradientUnits="userSpaceOnUse" x1="0" y1="838" x2="0" y2="1000">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>

    <pattern id="htSeams" width="44" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 21h44M22 0v21M0 0v10.5M44 0v10.5" fill="none" stroke="#000" stroke-opacity=".42" stroke-width="1.6"/>
      <path d="M0 19.6h44" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <pattern id="htStuds" width="30" height="16" patternUnits="userSpaceOnUse" patternTransform="skewY(-28)">
      <rect width="30" height="16" fill="#26262E"/>
      <rect x="3.5" y="2.5" width="23" height="11" rx="4.5" fill="#4E4E5A"/>
      <rect x="3.5" y="2.5" width="23" height="4.5" rx="2.2" fill="#6C6C7A"/>
    </pattern>
    <pattern id="htWin" width="44" height="34" patternUnits="userSpaceOnUse">
      <rect width="44" height="34" fill="#08080B"/>
      <rect x="9" y="8" width="26" height="18" rx="2" fill="#FFD502" fill-opacity=".82"/>
      <rect x="9" y="8" width="26" height="7" rx="2" fill="#FFF3BE" fill-opacity=".9"/>
    </pattern>

    <filter id="htSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="htGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="htBloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

  <clipPath id="htBelow"><rect x="0" y="838" width="1200" height="162"/></clipPath>
    <mask id="htRefMask"><rect x="0" y="838" width="1200" height="162" fill="url(#htFade)"/></mask>
  </defs>

  <g id="htModel">
    <!-- Peana -->
    <g>
      <path d="M330 848h540l44 26H286z" fill="#000" opacity=".55" filter="url(#htSoft)"/>
      <path d="M356 812h488l38 30H318z" fill="url(#htPlinth)"/>
      <path d="M356 812h488l38 30H318z" fill="url(#htSeams)" opacity=".5"/>
      <path d="M356 812h488" stroke="#FFD502" stroke-opacity=".45" stroke-width="1.5"/>
      <rect x="536" y="820" width="128" height="15" rx="2" fill="url(#htGold)"/>
      <text x="600" y="831" font-family="Sora, Segoe UI, sans-serif" font-size="9" font-weight="700" letter-spacing="2.4" fill="#0C0C0E" text-anchor="middle">ICONS · Nº 01</text>
    </g>

    <!-- Foco volumétrico -->
    <path d="M905 -60 L1290 858 L330 858 Z" fill="url(#htCone)" filter="url(#htSoft)"/>
    <ellipse cx="600" cy="600" rx="470" ry="430" fill="url(#htHalo)"/>

    <!-- Torre: 7 tramos escalonados (axonometría, luz clave superior derecha) -->
    <g>
      <!-- tramo 7 (corona) -->
      <g>
        <rect x="541" y="396" width="118" height="42" fill="url(#htBody)"/>
        <rect x="541" y="396" width="118" height="42" fill="url(#htSeams)"/>
        <rect x="541" y="396" width="118" height="42" fill="url(#htWin)" opacity=".85"/>
        <path d="M541 396h118l30-16H571z" fill="url(#htTop)"/>
        <path d="M541 396h118l30-16H571z" fill="url(#htStuds)"/>
        <path d="M659 396l30-16v42l-30 16z" fill="url(#htSide)"/>
        <path d="M659 396l30-16" stroke="#FFD502" stroke-opacity=".85" stroke-width="2" filter="url(#htGlow)"/>
        <g stroke="url(#htGold)" stroke-width="2.5" stroke-linecap="round">
          <path d="M556 400v34"/><path d="M572 400v34"/><path d="M600 400v34"/><path d="M628 400v34"/><path d="M644 400v34"/>
        </g>
      </g>
      <!-- tramo 6 -->
      <g>
        <rect x="520" y="438" width="160" height="42" fill="url(#htBody)"/>
        <rect x="520" y="438" width="160" height="42" fill="url(#htSeams)"/>
        <rect x="520" y="438" width="160" height="42" fill="url(#htWin)" opacity=".8"/>
        <path d="M520 438h160l30-16H550z" fill="url(#htTop)"/>
        <path d="M520 438h160l30-16H550z" fill="url(#htStuds)"/>
        <path d="M680 438l30-16v42l-30 16z" fill="url(#htSide)"/>
        <path d="M680 438l30-16" stroke="#FFD502" stroke-opacity=".7" stroke-width="2"/>
      </g>
      <!-- tramo 5 -->
      <g>
        <rect x="497" y="480" width="206" height="50" fill="url(#htBody)"/>
        <rect x="497" y="480" width="206" height="50" fill="url(#htSeams)"/>
        <rect x="497" y="480" width="206" height="50" fill="url(#htWin)" opacity=".8"/>
        <path d="M497 480h206l30-16H527z" fill="url(#htTop)"/>
        <path d="M497 480h206l30-16H527z" fill="url(#htStuds)"/>
        <path d="M703 480l30-16v50l-30 16z" fill="url(#htSide)"/>
        <path d="M703 480l30-16" stroke="#FFD502" stroke-opacity=".7" stroke-width="2"/>
      </g>
      <!-- tramo 4 -->
      <g>
        <rect x="470" y="530" width="260" height="60" fill="url(#htBody)"/>
        <rect x="470" y="530" width="260" height="60" fill="url(#htSeams)"/>
        <rect x="470" y="530" width="260" height="60" fill="url(#htWin)" opacity=".78"/>
        <path d="M470 530h260l30-16H500z" fill="url(#htTop)"/>
        <path d="M470 530h260l30-16H500z" fill="url(#htStuds)"/>
        <path d="M730 530l30-16v60l-30 16z" fill="url(#htSide)"/>
        <path d="M730 530l30-16" stroke="#FFD502" stroke-opacity=".7" stroke-width="2"/>
      </g>
      <!-- tramo 3 -->
      <g>
        <rect x="442" y="590" width="316" height="70" fill="url(#htBody)"/>
        <rect x="442" y="590" width="316" height="70" fill="url(#htSeams)"/>
        <rect x="442" y="590" width="316" height="70" fill="url(#htWin)" opacity=".76"/>
        <path d="M442 590h316l30-16H472z" fill="url(#htTop)"/>
        <path d="M442 590h316l30-16H472z" fill="url(#htStuds)"/>
        <path d="M758 590l30-16v70l-30 16z" fill="url(#htSide)"/>
        <path d="M758 590l30-16" stroke="#FFD502" stroke-opacity=".7" stroke-width="2"/>
      </g>
      <!-- tramo 2 -->
      <g>
        <rect x="412" y="660" width="376" height="80" fill="url(#htBody)"/>
        <rect x="412" y="660" width="376" height="80" fill="url(#htSeams)"/>
        <rect x="412" y="660" width="376" height="80" fill="url(#htWin)" opacity=".74"/>
        <path d="M412 660h376l30-16H442z" fill="url(#htTop)"/>
        <path d="M412 660h376l30-16H442z" fill="url(#htStuds)"/>
        <path d="M788 660l30-16v80l-30 16z" fill="url(#htSide)"/>
        <path d="M788 660l30-16" stroke="#FFD502" stroke-opacity=".65" stroke-width="2"/>
      </g>
      <!-- tramo 1 (planta baja) -->
      <g>
        <rect x="380" y="740" width="440" height="72" fill="url(#htBody)"/>
        <rect x="380" y="740" width="440" height="72" fill="url(#htSeams)"/>
        <path d="M380 740h440v72H380z" fill="none"/>
        <!-- pórtico acristalado en planta baja -->
        <g opacity=".9">
          <rect x="404" y="762" width="392" height="42" rx="3" fill="#07070A"/>
          <rect x="404" y="762" width="392" height="42" rx="3" fill="url(#htWin)"/>
        </g>
        <path d="M380 740h440l30-16H410z" fill="url(#htTop)"/>
        <path d="M380 740h440l30-16H410z" fill="url(#htStuds)"/>
        <path d="M820 740l30-16v72l-30 16z" fill="url(#htSide)"/>
        <path d="M820 740l30-16" stroke="#FFD502" stroke-opacity=".65" stroke-width="2"/>
        <!-- entrada -->
        <rect x="556" y="762" width="88" height="50" rx="2" fill="#0A0A0E"/>
        <rect x="556" y="762" width="88" height="50" rx="2" fill="url(#htSeams)" opacity=".7"/>
        <path d="M600 762v50" stroke="#FFD502" stroke-opacity=".5" stroke-width="1.5"/>
      </g>
      <!-- Aguja -->
      <g>
        <rect x="592" y="318" width="16" height="80" fill="url(#htGold)"/>
        <rect x="592" y="318" width="16" height="80" fill="url(#htSeams)" opacity=".35"/>
        <circle cx="600" cy="308" r="8" fill="#FFE55C" filter="url(#htGlow)"/>
        <circle cx="600" cy="308" r="3.4" fill="#FFFDF0"/>
        <path d="M572 380h56l-4 18H576z" fill="url(#htBody)"/>
        <path d="M572 380h56" stroke="#FFD502" stroke-opacity=".5" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Polvo en suspensión -->
    <g fill="#FFE9A0">
      <circle cx="470" cy="250" r="2.1" opacity=".5"/>
      <circle cx="760" cy="180" r="1.5" opacity=".38"/>
      <circle cx="352" cy="430" r="1.8" opacity=".30"/>
      <circle cx="880" cy="330" r="2.4" opacity=".34"/>
      <circle cx="640" cy="140" r="1.2" opacity=".45"/>
      <circle cx="300" cy="640" r="1.4" opacity=".26"/>
      <circle cx="930" cy="560" r="1.7" opacity=".30"/>
      <circle cx="520" cy="620" r="1.2" opacity=".34"/>
      <circle cx="200" cy="330" r="1.1" opacity=".22"/>
      <circle cx="1010" cy="240" r="1.3" opacity=".28"/>
      <circle cx="420" cy="120" r="1" opacity=".40"/>
      <circle cx="820" cy="720" r="1.4" opacity=".24"/>
    </g>
  </g>

  <!-- Reflejo en el suelo -->
  <g clip-path="url(#htBelow)">
    <g mask="url(#htRefMask)" opacity=".5" filter="url(#htSoft)">
      <use href="#htModel" transform="translate(0,1672) scale(1,-1)"/>
    </g>
  </g>
</svg>
