<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="ogTitle ogDesc">
  <title id="ogTitle">LEGO Icons: Brick Architecture &amp; Collector Series</title>
  <desc id="ogDesc">Cartel oscuro con tipografía dorada: Desconecta del mundo digital. Construye tu obra maestra.</desc>
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0C0E"/><stop offset=".55" stop-color="#101014"/><stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <linearGradient id="ogGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6B00"/><stop offset=".3" stop-color="#FFD502"/>
      <stop offset=".7" stop-color="#FFF0A8"/><stop offset="1" stop-color="#C9A200"/>
    </linearGradient>
    <radialGradient id="ogHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD502" stop-opacity=".3"/><stop offset="1" stop-color="#FFD502" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ogStuds" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="9" fill="#FFD502" fill-opacity=".05"/>
      <circle cx="15" cy="15" r="9" fill="none" stroke="#FFD502" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <pattern id="ogSeams" width="44" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 21h44M22 0v21M0 0v10.5M44 0v10.5" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="1.5"/>
    </pattern>
    <filter id="ogSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogStuds)"/>
  <ellipse cx="950" cy="315" rx="420" ry="330" fill="url(#ogHalo)"/>
  <path d="M1120 -60 L1300 640 L520 640 Z" fill="#FFD502" opacity=".06" filter="url(#ogSoft)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#FFD502" stroke-opacity=".22" stroke-width="2"/>

  <!-- Silueta de torre escalonada -->
  <g transform="translate(760,90)" fill="url(#ogSeams)">
    <rect x="20" y="300" width="320" height="150" fill="#16161B"/>
    <rect x="60" y="230" width="240" height="70" fill="#1C1C22"/>
    <rect x="100" y="170" width="160" height="60" fill="#22222A"/>
    <rect x="140" y="120" width="80" height="50" fill="#2A2A33"/>
    <g fill="#FFD502" fill-opacity=".75">
      <rect x="40" y="330" width="28" height="20" rx="2"/><rect x="96" y="330" width="28" height="20" rx="2"/>
      <rect x="152" y="330" width="28" height="20" rx="2"/><rect x="208" y="330" width="28" height="20" rx="2"/>
      <rect x="264" y="330" width="28" height="20" rx="2"/>
      <rect x="80" y="250" width="26" height="20" rx="2"/><rect x="134" y="250" width="26" height="20" rx="2"/>
      <rect x="188" y="250" width="26" height="20" rx="2"/><rect x="242" y="250" width="26" height="20" rx="2"/>
      <rect x="116" y="188" width="24" height="18" rx="2"/><rect x="166" y="188" width="24" height="18" rx="2"/>
      <rect x="216" y="188" width="24" height="18" rx="2"/><rect x="152" y="136" width="20" height="16" rx="2"/>
      <rect x="188" y="136" width="20" height="16" rx="2"/>
    </g>
    <rect x="172" y="60" width="12" height="62" fill="url(#ogGold)"/>
    <circle cx="178" cy="54" r="9" fill="#FFE55C"/>
    <path d="M0 450h360l30 26H-30z" fill="#0A0A0D"/>
    <path d="M0 450h360" stroke="#FFD502" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <!-- Bloque de texto -->
  <g transform="translate(80,0)">
    <g>
      <rect x="0" y="150" width="6" height="34" fill="#FFD502"/>
      <text x="22" y="164" font-family="Sora, Segoe UI, sans-serif" font-size="17" font-weight="600" letter-spacing="4.4" fill="#FFD502">EDICIÓN LIMITADA PARA COLECCIONISTAS</text>
    </g>
    <text x="0" y="262" font-family="Sora, Segoe UI, sans-serif" font-size="76" font-weight="800" fill="#F4F2EC" letter-spacing="-2.4">
      <tspan x="0" dy="0">Desconecta del</tspan>
      <tspan x="0" dy="86">mundo digital.</tspan>
    </text>
    <text x="0" y="416" font-family="Sora, Segoe UI, sans-serif" font-size="76" font-weight="800" fill="url(#ogGold)" letter-spacing="-2.4">Construye tu</text>
    <text x="0" y="500" font-family="Sora, Segoe UI, sans-serif" font-size="76" font-weight="800" fill="url(#ogGold)" letter-spacing="-2.4">obra maestra.</text>
    <text x="2" y="560" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="500" fill="#B9B6AE">LEGO Icons · Brick Architecture &amp; Collector Series</text>
  </g>
</svg>
